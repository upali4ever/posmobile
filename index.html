<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welfare Loan System</title>
    <!-- Tailwind CSS (UI Design සඳහා) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">පද්ධතියට පිවිසෙන්න</h2>
        
        <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email ලිපිනය</label>
                <input type="email" id="login-user" required placeholder="example@mail.com" 
                       class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">මුරපදය (Password)</label>
                <input type="password" id="login-pass" required placeholder="••••••••" 
                       class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                ඇතුළු වන්න (Login)
            </button>
        </form>
    </div>

    <!-- 2. MAIN APPLICATION SCREEN (ආරම්භයේදී සඟවා ඇත) -->
    <div id="main-app" class="hidden w-full max-w-4xl bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Welfare Loan Management System</h1>
            <button onclick="handleLogout()" 
                    class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition text-sm">
                ඉවත් වන්න (Logout)
            </button>
        </div>

        <!-- Dashboard / Main Content Container -->
        <div class="space-y-4">
            <p class="text-green-600 font-medium">✓ ඔබ සාර්ථකව පද්ධතියට සම්බන්ධ වී ඇත.</p>
            
            <!-- මෙතැනට ඔයාගේ Loan System එකේ Application Forms / Tables එකතු කරගත හැක -->
            <div class="p-4 bg-gray-50 border border-gray-200 rounded-md">
                <h3 class="font-bold text-gray-700 mb-2">Dashboard Active</h3>
                <p class="text-sm text-gray-600">ඔබගේ දත්ත සටහන් කිරීම් සහ ගණනය කිරීම් සඳහා මෙතැන භාවිතා කරන්න.</p>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // -------------------------------------------------------------
        // 1. SUPABASE CONFIGURATION
        // (ඔයාගේ Supabase Project URL එක සහ Anon Key එක මෙතැනට දාන්න)
        // -------------------------------------------------------------
        const SUPABASE_URL ="https://rcxzilsgxwnstnyoqocs.supabase.co"; 
        const SUPABASE_ANON_KEY =  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjeHppbHNneHduc3RueW9xb2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzc1ODIsImV4cCI6MjEwMTc1MzU4Mn0.vRQJwlK1yeM3YrgHmGA-jZeNrliSE2-4I7XHqgAFxjE";

        let db = null;

        // Supabase Client initialization
        try {
            if (SUPABASE_URL !== "https://your-project-ref.supabase.co" && typeof supabase !== 'undefined') {
                db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase initialize කිරීමේ දෝෂයක්:", e);
        }

        // -------------------------------------------------------------
        // 2. LOGIN FUNCTION
        // -------------------------------------------------------------
        async function handleLogin() {
            const email = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value.trim();

            if (!email || !password) {
                alert('කරුණාකර Email සහ Password ඇතුළත් කරන්න!');
                return;
            }

            // Fallback Offline/Admin Check
            if (email === 'admin@gmail.com' && password === '123') {
                showMainApp();
                return;
            }

            if (!db) {
                alert('Supabase Connection එක සක්‍රීය නැත! (Project URL/Key පරීක්ෂා කරන්න)');
                return;
            }

            try {
                // Supabase Auth Login Attempt
                const { data, error } = await db.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert('Login අසාර්ථකයි: ' + error.message);
                } else if (data.user) {
                    showMainApp();
                }
            } catch (err) {
                alert('දෝෂයක් සිදු විය: ' + err.message);
            }
        }

        // -------------------------------------------------------------
        // 3. LOGOUT FUNCTION
        // -------------------------------------------------------------
        async function handleLogout() {
            if (db) {
                await db.auth.signOut();
            }
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
        }

        // UI Switcher Function
        function showMainApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        }

        // -------------------------------------------------------------
        // 4. AUTO-CHECK SESSION ON LOAD
        // -------------------------------------------------------------
        window.onload = async () => {
            if (db) {
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    showMainApp();
                }
            }
        };
    </script>
</body>
</html>
